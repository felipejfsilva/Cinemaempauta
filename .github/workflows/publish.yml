name: CineCrítica BR — Publicação Automática

on:
  # Terça, Quinta e Sábado às 18:00 BRT (21:00 UTC)
  schedule:
    - cron: '0 21 * * 2,4,6'

  # Permite execução manual
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run scheduled publisher
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          PUPPETEER_EXECUTABLE_PATH: ""
        run: node scripts/scheduler.js --run

      - name: Update schedule status
        run: |
          git config user.name "CineCrítica BR Bot"
          git config user.email "bot@cinecriticabr.com"
          git add schedule.json
          git diff --cached --quiet || git commit -m "chore: atualiza status do schedule após publicação"
          git push
