<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="imagem-unica.css">
</head>
<body>
  <div class="slide-imagem-unica">

    <div class="fundo" style="background-image: url('{{imagem_fundo}}');"></div>
    <div class="overlay"></div>

    <div class="conteudo-overlay">
      <div class="linha-ouro"></div>
      <h1 class="titulo-filme">{{titulo_filme}}</h1>
      <p class="tese">{{tese}}</p>
    </div>

    <div class="logo-container">
      <svg viewBox="0 0 200 60" width="80" height="24">
        <text x="100" y="28" font-family="'Playfair Display', serif" font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">CINECRÍTICA</text>
        <line x1="30" y1="36" x2="170" y2="36" stroke="#FFFFFF" stroke-width="0.5" opacity="0.6"/>
        <text x="100" y="50" font-family="'Barlow Condensed', sans-serif" font-weight="400" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="4" opacity="0.8">BR</text>
      </svg>
    </div>

  </div>
</body>
</html>
